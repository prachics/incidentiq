- id: SC-TF-001
  kind: tool_failure
  query: we're seeing failures on user-service, no idea if it's us or downstream
  expected_service: user-service
  expected_archetype: downstream_timeout_cascade
  expected_root_cause: user-db became slow, and user-service had no timeout configured on calls to it.
    Request threads blocked indefinitely waiting on user-db, saturating user-service's pool and making
    user-service appear to be the failure when it was the victim.
  root_cause_keywords:
  - became
  - timeout
  - configured
  - threads
  - blocked
  - indefinitely
  - waiting
  - saturating
  - making
  - appear
  - failure
  - victim
  - cascade
  - timeout
  - dependency
  - circuit-breaker
  expected_tools:
  - get_service_logs
  true_cause_service: user-service
  inject_failures: true
  failure_rate: 0.35
  max_iterations: 8
  notes: Downstream dependency timeout cascading upstream on user-service, with 35% tool failure injection
