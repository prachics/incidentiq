- id: SC-TF-001
  kind: tool_failure
  query: we're seeing failures on elasticsearch-cluster, no idea if it's us or downstream
  expected_service: elasticsearch-cluster
  expected_archetype: search_shard_unassigned
  expected_root_cause: "Two primary shards on elasticsearch-cluster were unassigned after a node left\
    \ the cluster and disk-based allocation rules prevented reassignment \u2014 the remaining nodes had\
    \ crossed the high watermark. Queries silently returned partial results rather than failing."
  root_cause_keywords:
  - primary
  - shards
  - unassigned
  - cluster
  - allocation
  - prevented
  - reassignment
  - remaining
  - crossed
  - watermark
  - queries
  - silently
  - search
  - elasticsearch
  - shards
  - capacity
  expected_tools:
  - get_service_logs
  true_cause_service: elasticsearch-cluster
  inject_failures: true
  failure_rate: 0.35
  max_iterations: 8
  notes: Search cluster shards unassigned on elasticsearch-cluster, with 35% tool failure injection
