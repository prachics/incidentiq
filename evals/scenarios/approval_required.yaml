- id: SC-AP-001
  kind: approval_required
  query: alert fired on shipping-service. what's going on?
  expected_service: shipping-service
  expected_archetype: bad_deploy_regression
  expected_root_cause: Release v3.12.0 of shipping-service changed a response field from a string to an
    object without a compatibility shim. Callers still on the old contract failed to deserialise it, producing
    500s for exactly the fraction of traffic on old clients.
  root_cause_keywords:
  - release
  - changed
  - response
  - string
  - object
  - without
  - compatibility
  - callers
  - contract
  - failed
  - deserialise
  - producing
  - deploy
  - regression
  - rollback
  - release
  expected_tools:
  - get_service_logs
  acceptable_remediation_tools:
  - rollback_deploy
  requires_approval: true
  true_cause_service: shipping-service
  max_iterations: 8
  approval_decision: approve
  notes: rollback_deploy on shipping-service; human will approve
- id: SC-AP-002
  kind: approval_required
  query: customers are complaining about fraud-service
  expected_service: fraud-service
  expected_archetype: db_pool_exhausted
  expected_root_cause: All fraud-db connections were checked out and never returned. A code path added
    in the previous release failed to close its connection on the error branch, so each failed request
    permanently leaked one connection from the pool.
