# IncidentIQ - local stack.
#   docker compose up -d        brings up Postgres + Jaeger (traces at :16686)
#   docker compose --profile app up -d   also builds and runs the API and the
#                                        mock control plane it sends actions to
#
# The API is behind a profile so you can develop it locally against the
# containerised Postgres without rebuilding an image on every edit.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: incidentiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incidentiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentiq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-incidentiq}
    ports:
      # This machine only: the dev password is in .env.example.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incidentiq} -d ${POSTGRES_DB:-incidentiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    # Receives OTLP traces from the API and the control plane; UI at :16686.
    image: jaegertracing/all-in-one:1.62.0
    container_name: incidentiq-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"   # UI
      - "127.0.0.1:4318:4318"     # OTLP over HTTP

  api:
    profiles: ["app"]
    build:
      # Root context: pyproject.toml is here and the package is under api/.
      context: .
      dockerfile: api/Dockerfile
    container_name: incidentiq-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      # Override the host: inside the compose network Postgres is `postgres`.
      DATABASE_URL: postgresql://${POSTGRES_USER:-incidentiq}:${POSTGRES_PASSWORD:-incidentiq_dev_password}@postgres:5432/${POSTGRES_DB:-incidentiq}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Approved actions cross a real network boundary in the compose stack.
      CONTROL_PLANE_URL: http://control-plane:8100
    volumes:
      # Cache the downloaded embedding model between container restarts.
      - model_cache:/root/.cache/huggingface

  control-plane:
    profiles: ["app"]
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: incidentiq-control-plane
    restart: unless-stopped
    command: ["uvicorn", "incidentiq.controlplane.app:app", "--host", "0.0.0.0", "--port", "8100"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Unauthenticated mock: reachable from this machine only. The API uses
      # the compose network, not this mapping.
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8100}:8100"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-incidentiq}:${POSTGRES_PASSWORD:-incidentiq_dev_password}@postgres:5432/${POSTGRES_DB:-incidentiq}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

volumes:
  postgres_data:
  model_cache:
