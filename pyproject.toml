[project]
name = "incidentiq"
version = "0.1.0"
description = "Agentic AI production-support platform with retrieval, tool use, and human-in-the-loop approval."
requires-python = ">=3.11"

dependencies = [
    # ── Web layer ───────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",          # server-sent events for streaming agent progress

    # ── Config & validation ─────────────────────────────────
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",

    # ── Database ────────────────────────────────────────────
    "psycopg[binary,pool]>=3.2",   # Postgres driver, v3
    "pgvector>=0.3.6",             # registers the `vector` type with psycopg

    # ── Retrieval ───────────────────────────────────────────
    "sentence-transformers>=3.3",  # local embeddings (pulls torch)

    # ── Agent ───────────────────────────────────────────────
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "anthropic>=0.40",
    "httpx>=0.27",                 # used by the Ollama provider

    # ── Observability ───────────────────────────────────────
    "langfuse>=2.53,<3",

    # ── Evals & seeding ─────────────────────────────────────
    "pyyaml>=6.0",
    "faker>=30.0",                 # synthetic corpus generation
    "rich>=13.9",                  # readable CLI output for eval runs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These files embed markdown document bodies and multi-sentence incident
# narratives as string literals. Wrapping that prose to 100 columns would break
# the generated documents, not improve them.
"seeds/generate.py" = ["E501"]
"seeds/archetypes.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
